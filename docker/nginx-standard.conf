# ==============================================================================
# CONFIGURACIÓN MAESTRA DE NGINX - CLIMAS DEL DESIERTO
# ==============================================================================
# Este archivo sirve como plantilla para el proxy inverso en el host (VPS)
# Soluciona Error #48 (Inestabilidad) y Error #49 (Falta de HTTPS)
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name www.climasdeldesierto.com climasdeldesierto.com admin.climasdeldesierto.com;

    location / {
        return 301 https://$host$request_uri;
    }

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.climasdeldesierto.com climasdeldesierto.com admin.climasdeldesierto.com;

    # SSL Configuration (Let's Encrypt preferido)
    ssl_certificate /etc/letsencrypt/live/climasdeldesierto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/climasdeldesierto.com/privkey.pem;
    
    # HSTS (Security) - Error #49 fix
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Proxy a la aplicación Docker (ajustar puerto si es necesario)
    location / {
        proxy_pass http://127.0.0.1:8080; # Puerto default de la app en docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts altos para reportes pesados
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Logging optimizado
    access_log /var/log/nginx/cdd_access.log;
    error_log /var/log/nginx/cdd_error.log warn;

    client_max_body_size 256M;
}
