services:
  app:
    image: ghcr.io/jesusaln/cdd_climas:latest
    container_name: ${CONTAINER_APP:-climasdeldesierto-app-1}
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap:/var/www/bootstrap
      - ./.env:/var/www/.env
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./vendor:/var/www/vendor
      - ./public/build:/var/www/public/build
    environment:
      DB_HOST: ${DB_HOST:-cdd_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-cdd_climas}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - cdd_network
      - asistenciavircom_cdd_net
      - coolify_cdd_net
      - coolify

  worker:
    image: ghcr.io/jesusaln/cdd_climas:latest
    container_name: ${CONTAINER_WORKER:-climasdeldesierto-worker-1}
    restart: unless-stopped
    command: php artisan queue:work --queue=default,high --timeout=120 --tries=3 --sleep=1
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap:/var/www/bootstrap
      - ./.env:/var/www/.env
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./vendor:/var/www/vendor
    environment:
      DB_HOST: ${DB_HOST:-cdd_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-cdd_climas}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - cdd_network
      - asistenciavircom_cdd_net
      - coolify_cdd_net
      - coolify
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_WEB:-climasdeldesierto-web-1}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8083}:80"
    volumes:
      - ./docker/nginx.conf.vps.fix:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/public
      - ./storage/app/public:/var/www/public/storage
      - ./certs:/etc/nginx/certs
    networks:
      - cdd_network
      - asistenciavircom_cdd_net
    depends_on:
      - app

  reverb:
    image: ghcr.io/jesusaln/cdd_climas:latest
    container_name: ${CONTAINER_REVERB:-climasdeldesierto-reverb-1}
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    ports:
      - "${REVERB_PORT_HOST:-8084}:8080"
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap:/var/www/bootstrap
      - ./.env:/var/www/.env
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./vendor:/var/www/vendor
    environment:
      DB_HOST: ${DB_HOST:-cdd_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-cdd_climas}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - cdd_network
      - asistenciavircom_cdd_net
      - coolify_cdd_net
      - coolify

  worker2:
    image: ghcr.io/jesusaln/cdd_climas:latest
    container_name: ${CONTAINER_WORKER2:-climasdeldesierto-worker-2}
    restart: unless-stopped
    command: php artisan queue:work --queue=default,high --timeout=120 --tries=3 --sleep=1
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap:/var/www/bootstrap
      - ./.env:/var/www/.env
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./vendor:/var/www/vendor
    environment:
      DB_HOST: ${DB_HOST:-cdd_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-cdd_climas}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - cdd_network
      - asistenciavircom_cdd_net
      - coolify_cdd_net
      - coolify

  worker3:
    image: ghcr.io/jesusaln/cdd_climas:latest
    container_name: ${CONTAINER_WORKER3:-climasdeldesierto-worker-3}
    restart: unless-stopped
    command: php artisan queue:work --queue=default,high --timeout=120 --tries=3 --sleep=1
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap:/var/www/bootstrap
      - ./.env:/var/www/.env
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./vendor:/var/www/vendor
    environment:
      DB_HOST: ${DB_HOST:-cdd_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-cdd_climas}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - cdd_network
      - asistenciavircom_cdd_net
      - coolify_cdd_net
      - coolify

networks:
  cdd_network:
    driver: bridge
  asistenciavircom_cdd_net:
    external: true
    name: asistenciavircom_cdd_network
  coolify_cdd_net:
    external: true
    name: dgc4wsk44gs0kcoowsogggcw_cdd_net
  coolify:
    external: true
